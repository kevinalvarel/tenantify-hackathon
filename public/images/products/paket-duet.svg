<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgDuet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#FAE8FF"/>
    </linearGradient>
    <filter id="shadowDuet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4C1D95" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgDuet)"/>

  <!-- Tray / Presentation Mat -->
  <g filter="url(#shadowDuet)">
    <!-- Wooden serving board -->
    <rect x="50" y="70" width="300" height="175" rx="20" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="55" y="75" width="290" height="165" rx="16" fill="#F8FAFC"/>

    <!-- Left: Iced Coffee Glass (Kopi Susu Aren) -->
    <g transform="translate(45, 10)">
      <!-- Shadow -->
      <ellipse cx="90" cy="205" rx="30" ry="10" fill="#000000" opacity="0.12"/>

      <!-- Glass cup body -->
      <path d="M65,95 L72,195 Q90,205 108,195 L115,95 Z" fill="#E2E8F0" opacity="0.4"/>
      <!-- Brown sugar base -->
      <path d="M71,180 L72,195 Q90,205 108,195 L109,180 Q90,188 71,180 Z" fill="#451A03"/>
      <!-- Fresh milk & coffee swirl layer -->
      <path d="M67,115 L71,180 Q90,188 109,180 L113,115 Q90,125 67,115 Z" fill="#B45309"/>
      <!-- Coffee foam top -->
      <ellipse cx="90" cy="115" rx="23" ry="8" fill="#D97706"/>
      <ellipse cx="90" cy="113" rx="18" ry="5" fill="#FEF3C7" opacity="0.8"/>
      <!-- Ice cubes inside glass -->
      <rect x="76" y="125" width="12" height="12" rx="2" fill="#FFFFFF" opacity="0.5" transform="rotate(10 76 125)"/>
      <rect x="92" y="135" width="13" height="13" rx="2" fill="#FFFFFF" opacity="0.5" transform="rotate(-15 92 135)"/>
      <!-- Glass rim -->
      <ellipse cx="90" cy="95" rx="25" ry="7" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <!-- Straw -->
      <line x1="95" y1="170" x2="115" y2="70" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Plus / Combo sign in middle -->
    <g transform="translate(175, 135)">
      <circle cx="15" cy="15" r="14" fill="#6366F1" opacity="0.9"/>
      <path d="M15,8 L15,22 M8,15 L22,15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Right: Toasted Brioche with Chocolate & Cheese (Roti Bakar) -->
    <g transform="translate(185, 20)">
      <!-- Plate -->
      <ellipse cx="95" cy="175" rx="60" ry="28" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
      <ellipse cx="95" cy="172" rx="52" ry="22" fill="#FFFFFF"/>

      <!-- Toast Slice 1 (bottom) -->
      <path d="M55,155 C55,145 75,140 100,140 C125,140 145,145 145,155 L140,170 C140,175 120,180 98,180 C75,180 60,175 60,170 Z" fill="#B45309"/>
      <!-- Toast crust & crumb -->
      <path d="M58,150 C58,142 76,138 98,138 C120,138 138,142 138,150 L135,160 C135,165 118,168 98,168 C78,168 62,165 62,160 Z" fill="#F59E0B"/>
      <!-- Toast Slice 2 (cut in triangle/half stacked) -->
      <path d="M65,135 C65,128 82,125 102,125 C122,125 135,128 135,135 L130,148 C130,152 115,155 98,155 C80,155 68,152 68,148 Z" fill="#D97706"/>
      <path d="M68,132 C68,126 84,123 100,123 C118,123 130,126 130,132 L128,142 C128,146 114,148 98,148 C82,148 70,146 70,142 Z" fill="#FCD34D"/>

      <!-- Melty Chocolate Hazelnut Filling oozing -->
      <path d="M72,148 Q95,155 125,148 Q100,160 72,148 Z" fill="#3E2723"/>
      <!-- Chocolate drips -->
      <path d="M85,152 Q87,162 90,160 Q92,152 85,152 Z" fill="#3E2723"/>
      <path d="M108,150 Q110,164 114,162 Q115,150 108,150 Z" fill="#3E2723"/>

      <!-- Shredded Cheddar Cheese mountain on top -->
      <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
        <line x1="80" y1="124" x2="95" y2="122"/>
        <line x1="88" y1="120" x2="108" y2="124"/>
        <line x1="102" y1="121" x2="118" y2="122"/>
        <line x1="85" y1="126" x2="105" y2="128"/>
        <line x1="95" y1="125" x2="115" y2="127"/>
      </g>
    </g>
  </g>

  <!-- Watermark / Placeholder Badge -->
  <g transform="translate(16, 16)">
    <rect width="132" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#6366F1" stroke-width="1"/>
    <!-- Gift icon -->
    <path d="M6,9 L20,9 L20,20 L6,20 Z M4,6 L22,6 L22,9 L4,9 Z M13,6 L13,20" fill="none" stroke="#6366F1" stroke-width="1.2" transform="scale(0.8) translate(5, 4)"/>
    <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4338CA">Paket Duet Hemat</text>
  </g>
</svg>
