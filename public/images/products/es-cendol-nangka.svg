<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgNangka" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="gulaArenNangka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="shadowNangka" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#15803D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgNangka)"/>

  <!-- Glass Dessert Bowl with Stem -->
  <g filter="url(#shadowNangka)">
    <!-- Shadow under base -->
    <ellipse cx="200" cy="245" rx="50" ry="12" fill="#14532D" opacity="0.2"/>
    <!-- Glass Foot & Stem -->
    <ellipse cx="200" cy="235" rx="42" ry="10" fill="#E2E8F0" opacity="0.6"/>
    <path d="M194,185 L192,235 L208,235 L206,185 Z" fill="#E2E8F0" opacity="0.6"/>

    <!-- Wide Bowl Body -->
    <path d="M130,95 Q130,190 200,190 Q270,190 270,95 Z" fill="#F8FAFC" opacity="0.4"/>

    <!-- Brown Sugar Base Layer -->
    <path d="M160,170 Q200,190 240,170 Q245,180 200,188 Q155,180 160,170 Z" fill="url(#gulaArenNangka)"/>

    <!-- Pandan Cendol & Coconut Milk filling -->
    <path d="M136,120 Q136,180 200,180 Q264,180 264,120 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Green Cendol jellies -->
    <g fill="#16A34A" stroke="#15803D" stroke-width="1">
      <path d="M165,145 C158,140 168,135 175,140 C180,145 172,150 165,145 Z"/>
      <path d="M195,150 C188,145 198,140 205,145 C210,150 202,155 195,150 Z"/>
      <path d="M225,142 C218,138 228,132 235,138 C240,142 232,148 225,142 Z"/>
      <path d="M180,160 C174,156 184,150 190,155 C195,160 188,165 180,160 Z"/>
      <path d="M210,162 C204,158 214,152 220,156 C225,162 218,167 210,162 Z"/>
    </g>

    <!-- Sweet Golden Jackfruit (Nangka) Slices -->
    <g fill="#EAB308" stroke="#CA8A04" stroke-width="1.2">
      <!-- Nangka slice 1 -->
      <path d="M160,105 Q175,90 190,105 Q175,115 160,105 Z" fill="#FACC15"/>
      <!-- Nangka slice 2 -->
      <path d="M195,100 Q215,85 230,102 Q215,112 195,100 Z" fill="#FDE047"/>
      <!-- Nangka diced bits -->
      <rect x="175" y="115" width="14" height="12" rx="3" transform="rotate(20 175 115)"/>
      <rect x="210" y="118" width="13" height="11" rx="3" transform="rotate(-15 210 118)"/>
      <rect x="190" y="125" width="12" height="10" rx="2.5" transform="rotate(5 190 125)"/>
    </g>

    <!-- Shaved Ice mountain in center -->
    <ellipse cx="200" cy="95" rx="55" ry="18" fill="#F1F5F9" opacity="0.9"/>
    <!-- Mint sprig garnish on top -->
    <path d="M200,90 C190,75 200,68 205,75 C210,68 220,75 210,90 Z" fill="#22C55E"/>

    <!-- Glass Rim & reflections -->
    <ellipse cx="200" cy="95" rx="70" ry="18" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <path d="M135,110 Q140,170 190,180" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Watermark / Placeholder Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#16A34A" stroke-width="1"/>
    <path d="M12,15 A3,3 0 1,0 18,15 A3,3 0 1,0 12,15 M8,9 L10,7 L20,7 L22,9 L25,9 A2,2 0 0,1 27,11 L27,19 A2,2 0 0,1 25,21 L5,21 A2,2 0 0,1 3,19 L3,11 A2,2 0 0,1 5,9 Z" fill="none" stroke="#16A34A" stroke-width="1.2" transform="scale(0.7) translate(3, 4)"/>
    <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#14532D">Es Cendol Nangka</text>
  </g>
</svg>
