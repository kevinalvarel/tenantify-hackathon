<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgDimsum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadowDimsum" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgDimsum)"/>

  <!-- Steamer Basket (Klakat Bambu) -->
  <g filter="url(#shadowDimsum)">
    <!-- Shadow under steamer -->
    <ellipse cx="200" cy="210" rx="135" ry="50" fill="#78350F" opacity="0.2"/>

    <!-- Steamer base outer wall -->
    <path d="M70,165 Q200,200 330,165 L330,195 Q200,230 70,195 Z" fill="#B45309"/>
    <!-- Bamboo slats pattern -->
    <path d="M120,177 L120,207 M180,183 L180,213 M240,181 L240,211 M290,174 L290,204" stroke="#92400E" stroke-width="2" opacity="0.4"/>

    <!-- Bamboo rim -->
    <ellipse cx="200" cy="165" rx="130" ry="46" fill="#D97706" stroke="#92400E" stroke-width="3"/>
    <ellipse cx="200" cy="163" rx="122" ry="42" fill="#FDE68A"/>

    <!-- Steaming paper lining with perforated holes -->
    <ellipse cx="200" cy="161" rx="112" ry="38" fill="#FFFFFF" opacity="0.85"/>
    <g fill="#CBD5E1" opacity="0.5">
      <circle cx="120" cy="160" r="1.5"/><circle cx="140" cy="175" r="1.5"/>
      <circle cx="260" cy="175" r="1.5"/><circle cx="280" cy="160" r="1.5"/>
    </g>

    <!-- 4 Plump Siomay Dumplings -->
    <!-- Dumpling 1: Top Left -->
    <g transform="translate(145, 125)">
      <!-- Yellow wonton skin pleated body -->
      <path d="M10,25 C0,20 5,5 20,5 C35,5 40,20 30,25 C25,28 15,28 10,25 Z" fill="#F59E0B"/>
      <ellipse cx="20" cy="10" rx="14" ry="7" fill="#FCD34D"/>
      <!-- Minced chicken/shrimp meat center -->
      <ellipse cx="20" cy="9" rx="11" ry="5" fill="#E2E8F0"/>
      <!-- Orange Carrot / Tobiko topping -->
      <ellipse cx="20" cy="8" rx="5" ry="2.5" fill="#EA580C"/>
      <!-- Skin pleat folds -->
      <path d="M10,12 Q20,18 30,12" stroke="#D97706" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Dumpling 2: Top Right -->
    <g transform="translate(215, 125)">
      <path d="M10,25 C0,20 5,5 20,5 C35,5 40,20 30,25 C25,28 15,28 10,25 Z" fill="#F59E0B"/>
      <ellipse cx="20" cy="10" rx="14" ry="7" fill="#FCD34D"/>
      <ellipse cx="20" cy="9" rx="11" ry="5" fill="#E2E8F0"/>
      <ellipse cx="20" cy="8" rx="5" ry="2.5" fill="#EA580C"/>
      <path d="M10,12 Q20,18 30,12" stroke="#D97706" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Dumpling 3: Bottom Left -->
    <g transform="translate(130, 150)">
      <path d="M10,28 C-2,22 4,5 22,5 C40,5 44,22 32,28 C26,31 16,31 10,28 Z" fill="#D97706"/>
      <path d="M12,25 C2,20 6,6 22,6 C38,6 42,20 30,25 C25,28 16,28 12,25 Z" fill="#F59E0B"/>
      <ellipse cx="22" cy="11" rx="15" ry="8" fill="#FCD34D"/>
      <ellipse cx="22" cy="10" rx="12" ry="5.5" fill="#E2E8F0"/>
      <ellipse cx="22" cy="9" rx="6" ry="3" fill="#EA580C"/>
      <path d="M12,14 Q22,21 32,14" stroke="#D97706" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Dumpling 4: Bottom Right -->
    <g transform="translate(225, 150)">
      <path d="M10,28 C-2,22 4,5 22,5 C40,5 44,22 32,28 C26,31 16,31 10,28 Z" fill="#D97706"/>
      <path d="M12,25 C2,20 6,6 22,6 C38,6 42,20 30,25 C25,28 16,28 12,25 Z" fill="#F59E0B"/>
      <ellipse cx="22" cy="11" rx="15" ry="8" fill="#FCD34D"/>
      <ellipse cx="22" cy="10" rx="12" ry="5.5" fill="#E2E8F0"/>
      <ellipse cx="22" cy="9" rx="6" ry="3" fill="#EA580C"/>
      <path d="M12,14 Q22,21 32,14" stroke="#D97706" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Chili Oil Dip in Center / Side -->
    <g transform="translate(180, 160)">
      <ellipse cx="20" cy="12" rx="16" ry="9" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5"/>
      <ellipse cx="20" cy="11" rx="13" ry="7" fill="#DC2626"/>
      <ellipse cx="22" cy="10" rx="9" ry="4" fill="#EF4444"/>
      <!-- Chili bits -->
      <circle cx="17" cy="10" r="1" fill="#7F1D1D"/>
      <circle cx="22" cy="12" r="1.2" fill="#7F1D1D"/>
    </g>
  </g>

  <!-- Steaming Swirls -->
  <path d="M165,115 Q160,95 170,80 T165,60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M235,115 Q245,95 235,80 T240,60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Watermark / Placeholder Badge -->
  <g transform="translate(16, 16)">
    <rect width="128" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#EA580C" stroke-width="1"/>
    <path d="M12,15 A3,3 0 1,0 18,15 A3,3 0 1,0 12,15 M8,9 L10,7 L20,7 L22,9 L25,9 A2,2 0 0,1 27,11 L27,19 A2,2 0 0,1 25,21 L5,21 A2,2 0 0,1 3,19 L3,11 A2,2 0 0,1 5,9 Z" fill="none" stroke="#EA580C" stroke-width="1.2" transform="scale(0.7) translate(3, 4)"/>
    <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9A3412">Dimsum &amp; Snack</text>
  </g>
</svg>
