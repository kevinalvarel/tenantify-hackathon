<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgHakau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="50%" stop-color="#FFE4E6"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>
    <filter id="shadowHakau" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#881337" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgHakau)"/>

  <!-- Steamer Basket -->
  <g filter="url(#shadowHakau)">
    <ellipse cx="200" cy="205" rx="130" ry="48" fill="#78350F" opacity="0.18"/>
    <!-- Bamboo basket outer -->
    <path d="M75,160 Q200,195 325,160 L325,190 Q200,225 75,190 Z" fill="#B45309"/>
    <!-- Bamboo rim -->
    <ellipse cx="200" cy="160" rx="125" ry="44" fill="#D97706" stroke="#92400E" stroke-width="2.5"/>
    <ellipse cx="200" cy="158" rx="118" ry="40" fill="#FEF3C7"/>

    <!-- Perforated Steaming Paper -->
    <ellipse cx="200" cy="156" rx="108" ry="36" fill="#FFFFFF" opacity="0.9"/>
    <g fill="#CBD5E1" opacity="0.4">
      <circle cx="125" cy="155" r="1.5"/><circle cx="150" cy="170" r="1.5"/>
      <circle cx="250" cy="170" r="1.5"/><circle cx="275" cy="155" r="1.5"/>
    </g>

    <!-- 3 Crystal Shrimp Dumplings (Hakau) -->
    <!-- Dumpling 1 (Left) -->
    <g transform="translate(135, 125)">
      <!-- Translucent skin with pink shrimp showing through -->
      <ellipse cx="25" cy="20" rx="22" ry="16" fill="#FB7185" opacity="0.5"/>
      <!-- Whole shrimp curl inside -->
      <path d="M12,20 C10,12 25,10 32,18 C36,24 28,30 20,26" stroke="#E11D48" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <!-- Translucent crystal skin cover -->
      <ellipse cx="25" cy="18" rx="26" ry="17" fill="#FFFFFF" fill-opacity="0.75" stroke="#FECDD3" stroke-width="1.5"/>
      <!-- Delicate pleat lines on top -->
      <path d="M15,10 C18,16 18,22 17,26 M22,8 C25,15 25,22 23,27 M29,9 C31,16 30,22 28,27 M35,12 C35,17 33,22 31,25" stroke="#FDA4AF" stroke-width="1.2" fill="none"/>
      <!-- Shiny glaze highlight -->
      <ellipse cx="20" cy="14" rx="8" ry="4" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Dumpling 2 (Right) -->
    <g transform="translate(215, 125)">
      <ellipse cx="25" cy="20" rx="22" ry="16" fill="#FB7185" opacity="0.5"/>
      <path d="M38,20 C40,12 25,10 18,18 C14,24 22,30 30,26" stroke="#E11D48" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <ellipse cx="25" cy="18" rx="26" ry="17" fill="#FFFFFF" fill-opacity="0.75" stroke="#FECDD3" stroke-width="1.5"/>
      <path d="M35,10 C32,16 32,22 33,26 M28,8 C25,15 25,22 27,27 M21,9 C19,16 20,22 22,27 M15,12 C15,17 17,22 19,25" stroke="#FDA4AF" stroke-width="1.2" fill="none"/>
      <ellipse cx="30" cy="14" rx="8" ry="4" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Dumpling 3 (Center Front) -->
    <g transform="translate(175, 150)">
      <ellipse cx="25" cy="22" rx="25" ry="18" fill="#FB7185" opacity="0.55"/>
      <path d="M12,22 C10,12 25,9 35,18 C40,24 30,32 20,28" stroke="#E11D48" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85"/>
      <ellipse cx="25" cy="20" rx="30" ry="19" fill="#FFFFFF" fill-opacity="0.8" stroke="#FECDD3" stroke-width="1.5"/>
      <path d="M13,11 C17,17 17,25 15,29 M20,9 C24,16 24,25 21,30 M27,8 C30,16 29,25 26,30 M34,10 C35,17 33,24 30,28" stroke="#FDA4AF" stroke-width="1.3" fill="none"/>
      <ellipse cx="20" cy="15" rx="10" ry="4.5" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>

  <!-- Steam curves -->
  <path d="M185,115 Q175,95 185,75 T180,55" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M225,110 Q235,90 225,70 T230,50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Watermark / Placeholder Badge -->
  <g transform="translate(16, 16)">
    <rect width="138" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#E11D48" stroke-width="1"/>
    <path d="M12,15 A3,3 0 1,0 18,15 A3,3 0 1,0 12,15 M8,9 L10,7 L20,7 L22,9 L25,9 A2,2 0 0,1 27,11 L27,19 A2,2 0 0,1 25,21 L5,21 A2,2 0 0,1 3,19 L3,11 A2,2 0 0,1 5,9 Z" fill="none" stroke="#E11D48" stroke-width="1.2" transform="scale(0.7) translate(3, 4)"/>
    <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9F1239">Hakau Udang Kristal</text>
  </g>
</svg>
