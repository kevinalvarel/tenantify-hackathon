<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgCendol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="gulaAren" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="santan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadowGlass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#065F46" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgCendol)"/>

  <!-- Glass Dessert Cup / Tall Tumbler -->
  <g filter="url(#shadowGlass)">
    <!-- Base shadow -->
    <ellipse cx="200" cy="245" rx="55" ry="14" fill="#047857" opacity="0.2"/>

    <!-- Glass Body Outline & Back -->
    <path d="M150,75 L165,225 Q200,240 235,225 L250,75 Z" fill="#E2E8F0" opacity="0.3"/>

    <!-- Bottom Layer: Gula Aren Syrup (Brown Sugar) -->
    <path d="M163,205 L165,225 Q200,240 235,225 L237,205 Q200,215 163,205 Z" fill="url(#gulaAren)"/>

    <!-- Middle Layer: Green Pandan Cendol Droplets in Coconut Milk -->
    <path d="M158,155 L163,205 Q200,215 237,205 L242,155 Q200,165 158,155 Z" fill="url(#santan)"/>
    <!-- Green Cendol Jellies floating -->
    <g fill="#16A34A" stroke="#15803D" stroke-width="1">
      <!-- Cendol droplets -->
      <path d="M175,170 C170,165 178,160 185,166 C190,172 180,176 175,170 Z"/>
      <path d="M210,175 C205,170 215,165 222,170 C228,175 218,182 210,175 Z"/>
      <path d="M188,185 C180,180 190,175 198,180 C204,185 194,192 188,185 Z"/>
      <path d="M172,192 C168,188 175,182 182,186 C186,190 178,196 172,192 Z"/>
      <path d="M218,190 C212,185 224,182 228,187 C232,192 222,196 218,190 Z"/>
    </g>

    <!-- Upper Layer: Shaved Ice & Creamy Coconut Milk -->
    <path d="M152,95 L158,155 Q200,165 242,155 L248,95 Q200,105 152,95 Z" fill="#F8FAFC" opacity="0.95"/>
    <!-- Ice cubes texture -->
    <g fill="#E2E8F0" opacity="0.6">
      <rect x="170" y="110" width="16" height="14" rx="3" transform="rotate(15 170 110)"/>
      <rect x="210" y="115" width="18" height="15" rx="3" transform="rotate(-10 210 115)"/>
      <rect x="185" y="130" width="15" height="14" rx="2" transform="rotate(5 185 130)"/>
    </g>

    <!-- Top: Real Durian Montong Flesh Scoop! -->
    <g filter="url(#shadowGlass)">
      <!-- Golden yellow durian pulp -->
      <ellipse cx="200" cy="85" rx="36" ry="24" fill="#FACC15"/>
      <ellipse cx="195" cy="80" rx="30" ry="18" fill="#FDE047"/>
      <!-- Durian texture creases -->
      <path d="M175,82 Q195,88 215,80" stroke="#EAB308" stroke-width="2" fill="none"/>
      <path d="M182,72 Q200,78 218,72" stroke="#EAB308" stroke-width="1.8" fill="none"/>
      <!-- Soft highlight -->
      <ellipse cx="190" cy="74" rx="10" ry="5" fill="#FEF08A" opacity="0.9"/>
    </g>

    <!-- Clear Glass Reflections -->
    <path d="M155,80 L168,220" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M162,90 L172,210" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="200" cy="75" rx="50" ry="12" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

    <!-- Straw -->
    <line x1="225" y1="180" x2="255" y2="40" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <line x1="225" y1="180" x2="255" y2="40" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Cold Refreshing Droplets & Sparkles -->
  <g fill="#10B981" opacity="0.7">
    <circle cx="130" cy="110" r="3"/>
    <circle cx="270" cy="125" r="2.5"/>
    <circle cx="140" cy="180" r="2"/>
    <circle cx="265" cy="190" r="3"/>
  </g>

  <!-- Watermark / Placeholder Badge -->
  <g transform="translate(16, 16)">
    <rect width="144" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#059669" stroke-width="1"/>
    <path d="M12,15 A3,3 0 1,0 18,15 A3,3 0 1,0 12,15 M8,9 L10,7 L20,7 L22,9 L25,9 A2,2 0 0,1 27,11 L27,19 A2,2 0 0,1 25,21 L5,21 A2,2 0 0,1 3,19 L3,11 A2,2 0 0,1 5,9 Z" fill="none" stroke="#059669" stroke-width="1.2" transform="scale(0.7) translate(3, 4)"/>
    <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46">Es Cendol Durian</text>
  </g>
</svg>
