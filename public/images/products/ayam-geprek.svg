<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGeprek" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <radialGradient id="plateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGeprek)"/>

  <!-- Subtle food pattern background -->
  <g opacity="0.06" stroke="#9A3412" stroke-width="2" fill="none">
    <circle cx="40" cy="50" r="16"/>
    <circle cx="360" cy="60" r="22"/>
    <circle cx="60" cy="240" r="20"/>
    <circle cx="340" cy="230" r="15"/>
    <path d="M120,40 Q130,20 140,40 T160,40"/>
    <path d="M260,260 Q270,240 280,260 T300,260"/>
  </g>

  <!-- Ceramic Plate -->
  <g filter="url(#shadow)">
    <!-- Plate base -->
    <ellipse cx="200" cy="155" rx="140" ry="85" fill="#FAFAF9" stroke="#E7E5E4" stroke-width="4"/>
    <ellipse cx="200" cy="153" rx="122" ry="72" fill="#F5F5F4"/>
    <ellipse cx="200" cy="150" rx="105" ry="60" fill="url(#plateGlow)"/>

    <!-- Steaming Rice Portion (Nasi Hangat) -->
    <ellipse cx="150" cy="150" rx="42" ry="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <ellipse cx="148" cy="144" rx="36" ry="26" fill="#F8FAFC"/>
    <!-- Rice texture dots -->
    <g fill="#CBD5E1" opacity="0.6">
      <circle cx="140" cy="140" r="1.5"/><circle cx="152" cy="138" r="1.5"/>
      <circle cx="134" cy="148" r="1.5"/><circle cx="160" cy="146" r="1.5"/>
      <circle cx="146" cy="152" r="1.5"/><circle cx="155" cy="156" r="1.5"/>
    </g>
    <!-- Fried Shallot Garnish on rice -->
    <g fill="#9A3412" opacity="0.8">
      <rect x="144" y="138" width="6" height="2" rx="1" transform="rotate(-15 144 138)"/>
      <rect x="152" y="142" width="7" height="2" rx="1" transform="rotate(30 152 142)"/>
      <rect x="138" y="146" width="6" height="2" rx="1" transform="rotate(10 138 146)"/>
    </g>

    <!-- Crispy Ayam Geprek Piece -->
    <g filter="url(#shadow)">
      <!-- Golden crispy chicken silhouette -->
      <path d="M205,120 C235,110 265,125 260,155 C255,175 220,185 195,175 C178,168 185,135 205,120 Z" fill="#C2410C"/>
      <!-- Crispy crust layers -->
      <path d="M210,123 C235,115 258,128 254,152 C250,170 220,178 198,170 C184,164 192,135 210,123 Z" fill="#EA580C"/>
      <path d="M215,128 C232,122 250,132 246,148 C242,162 218,170 202,164 C192,158 198,138 215,128 Z" fill="#F97316"/>
      <!-- Spicy Sambal Korek spread on top -->
      <path d="M208,135 C222,128 238,132 242,142 C240,152 225,160 212,156 C202,152 200,140 208,135 Z" fill="#DC2626"/>
      <path d="M215,138 C224,133 234,136 236,144 C234,150 222,154 216,151 C210,148 210,141 215,138 Z" fill="#EF4444"/>
      <!-- Chili seeds & rawit chunks -->
      <g fill="#FEF08A">
        <circle cx="218" cy="140" r="1.5"/>
        <circle cx="228" cy="144" r="1.5"/>
        <circle cx="222" cy="148" r="1.5"/>
        <circle cx="232" cy="140" r="1.5"/>
      </g>
      <!-- Green rawit bits -->
      <g fill="#16A34A">
        <rect x="214" y="144" width="4" height="2" rx="1" transform="rotate(25 214 144)"/>
        <rect x="226" y="136" width="3" height="2" rx="1" transform="rotate(-30 226 136)"/>
      </g>
    </g>

    <!-- Fresh Cucumber & Tomato slices garnish -->
    <!-- Cucumber 1 -->
    <ellipse cx="260" cy="168" rx="14" ry="9" fill="#22C55E" transform="rotate(-20 260 168)"/>
    <ellipse cx="260" cy="168" rx="10" ry="6" fill="#86EFAC" transform="rotate(-20 260 168)"/>
    <!-- Cucumber 2 -->
    <ellipse cx="248" cy="178" rx="14" ry="9" fill="#22C55E" transform="rotate(10 248 178)"/>
    <ellipse cx="248" cy="178" rx="10" ry="6" fill="#86EFAC" transform="rotate(10 248 178)"/>
  </g>

  <!-- Steam lines rising -->
  <path d="M145,120 Q140,105 148,95 T142,80" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M158,115 Q165,100 157,90 T163,75" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Watermark / Placeholder Badge -->
  <g transform="translate(16, 16)">
    <rect width="118" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#EA580C" stroke-width="1"/>
    <!-- Camera icon -->
    <path d="M12,15 A3,3 0 1,0 18,15 A3,3 0 1,0 12,15 M8,9 L10,7 L20,7 L22,9 L25,9 A2,2 0 0,1 27,11 L27,19 A2,2 0 0,1 25,21 L5,21 A2,2 0 0,1 3,19 L3,11 A2,2 0 0,1 5,9 Z" fill="none" stroke="#EA580C" stroke-width="1.2" transform="scale(0.7) translate(3, 4)"/>
    <text x="32" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#9A3412">Menu Spesial</text>
  </g>
</svg>
