<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgSnackPlaceholder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <filter id="sShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#B45309" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgSnackPlaceholder)"/>

  <!-- Center Snack Emblem -->
  <g filter="url(#sShadow)" transform="translate(140, 75)">
    <circle cx="60" cy="65" r="58" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
    <!-- Cookie / Pastry / Dimsum Snack Icon -->
    <circle cx="60" cy="65" r="26" fill="#F59E0B"/>
    <circle cx="60" cy="65" r="21" fill="#FBBF24"/>
    <!-- Bites & Chocolate/topping chips -->
    <circle cx="52" cy="58" r="3.5" fill="#78350F"/>
    <circle cx="68" cy="56" r="3" fill="#78350F"/>
    <circle cx="62" cy="72" r="3.5" fill="#78350F"/>
    <circle cx="50" cy="70" r="2.5" fill="#78350F"/>
    <!-- Sparkles -->
    <path d="M84,36 L86,30 L88,36 L94,38 L88,40 L86,46 L84,40 L78,38 Z" fill="#D97706"/>
  </g>

  <!-- Label Badge -->
  <g transform="translate(130, 220)">
    <rect width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="24" cy="14" r="3.5" fill="none" stroke="#B45309" stroke-width="1.5"/>
    <path d="M16,11 L18,8 L30,8 L32,11 L35,11 A1.5,1.5 0 0,1 36.5,12.5 L36.5,18.5 A1.5,1.5 0 0,1 35,20 L13,20 A1.5,1.5 0 0,1 11.5,18.5 L11.5,12.5 A1.5,1.5 0 0,1 13,11 Z" fill="none" stroke="#B45309" stroke-width="1.3"/>
    <text x="44" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400E">Menu Camilan</text>
  </g>
</svg>
