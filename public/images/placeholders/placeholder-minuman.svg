<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgDrinkPlaceholder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="dShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0369A1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgDrinkPlaceholder)"/>

  <!-- Center Cup Emblem -->
  <g filter="url(#dShadow)" transform="translate(140, 75)">
    <circle cx="60" cy="65" r="58" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    <!-- Cold Drink Tumbler with straw -->
    <path d="M42,50 L48,92 Q60,98 72,92 L78,50 Z" fill="#0284C7"/>
    <ellipse cx="60" cy="50" rx="18" ry="4" fill="#38BDF8"/>
    <!-- Straw -->
    <line x1="64" y1="50" x2="72" y2="28" stroke="#0369A1" stroke-width="3" stroke-linecap="round"/>
    <!-- Ice cubes inside -->
    <rect x="52" y="60" width="7" height="7" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="61" y="70" width="8" height="8" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- Sparkles -->
    <path d="M82,38 L84,32 L86,38 L92,40 L86,42 L84,48 L82,42 L76,40 Z" fill="#0284C7"/>
  </g>

  <!-- Label Badge -->
  <g transform="translate(130, 220)">
    <rect width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#0284C7" stroke-width="1.2"/>
    <circle cx="24" cy="14" r="3.5" fill="none" stroke="#0369A1" stroke-width="1.5"/>
    <path d="M16,11 L18,8 L30,8 L32,11 L35,11 A1.5,1.5 0 0,1 36.5,12.5 L36.5,18.5 A1.5,1.5 0 0,1 35,20 L13,20 A1.5,1.5 0 0,1 11.5,18.5 L11.5,12.5 A1.5,1.5 0 0,1 13,11 Z" fill="none" stroke="#0369A1" stroke-width="1.3"/>
    <text x="44" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#075985">Menu Minuman</text>
  </g>
</svg>
