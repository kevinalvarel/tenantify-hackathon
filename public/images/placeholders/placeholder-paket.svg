<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgComboPlaceholder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgComboPlaceholder)"/>

  <!-- Center Combo Emblem -->
  <g filter="url(#pShadow)" transform="translate(140, 75)">
    <circle cx="60" cy="65" r="58" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <!-- Gift / Combo Box Icon -->
    <rect x="36" y="52" width="48" height="36" rx="4" fill="#6366F1"/>
    <!-- Lid -->
    <rect x="32" y="44" width="56" height="10" rx="3" fill="#4F46E5"/>
    <!-- Ribbon vertical -->
    <rect x="56" y="44" width="8" height="44" fill="#FBBF24"/>
    <!-- Ribbon Bow -->
    <ellipse cx="52" cy="40" rx="8" ry="5" fill="#F59E0B" transform="rotate(-20 52 40)"/>
    <ellipse cx="68" cy="40" rx="8" ry="5" fill="#F59E0B" transform="rotate(20 68 40)"/>
    <circle cx="60" cy="42" r="3.5" fill="#D97706"/>
    <!-- Sparkles -->
    <path d="M84,36 L86,30 L88,36 L94,38 L88,40 L86,46 L84,40 L78,38 Z" fill="#818CF8"/>
  </g>

  <!-- Label Badge -->
  <g transform="translate(130, 220)">
    <rect width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="24" cy="14" r="3.5" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <path d="M16,11 L18,8 L30,8 L32,11 L35,11 A1.5,1.5 0 0,1 36.5,12.5 L36.5,18.5 A1.5,1.5 0 0,1 35,20 L13,20 A1.5,1.5 0 0,1 11.5,18.5 L11.5,12.5 A1.5,1.5 0 0,1 13,11 Z" fill="none" stroke="#4F46E5" stroke-width="1.3"/>
    <text x="44" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3730A3">Paket Hemat</text>
  </g>
</svg>
