<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgFoodPlaceholder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C2410C" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgFoodPlaceholder)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#C2410C" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/><line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/>
  </g>

  <!-- Center Cloche / Food Emblem -->
  <g filter="url(#fShadow)" transform="translate(140, 75)">
    <!-- White circular card -->
    <circle cx="60" cy="65" r="58" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
    <!-- Cloche dish icon -->
    <path d="M30,75 L90,75 C90,75 88,40 60,40 C32,40 30,75 30,75 Z" fill="#F97316"/>
    <!-- Cloche handle -->
    <circle cx="60" cy="35" r="6" fill="#EA580C"/>
    <!-- Cloche tray -->
    <rect x="22" y="75" width="76" height="5" rx="2.5" fill="#C2410C"/>
    <!-- Steam lines -->
    <path d="M48,26 Q45,16 52,10" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M60,22 Q65,14 58,8" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M72,26 Q75,16 68,10" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Label Badge -->
  <g transform="translate(130, 220)">
    <rect width="140" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#F97316" stroke-width="1.2"/>
    <!-- Camera/Photo Icon -->
    <circle cx="24" cy="14" r="3.5" fill="none" stroke="#C2410C" stroke-width="1.5"/>
    <path d="M16,11 L18,8 L30,8 L32,11 L35,11 A1.5,1.5 0 0,1 36.5,12.5 L36.5,18.5 A1.5,1.5 0 0,1 35,20 L13,20 A1.5,1.5 0 0,1 11.5,18.5 L11.5,12.5 A1.5,1.5 0 0,1 13,11 Z" fill="none" stroke="#C2410C" stroke-width="1.3"/>
    <text x="44" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9A3412">Menu Makanan</text>
  </g>
</svg>
